<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="utf-8" />
    <title>Nitro-Flash Hyper-Real Pro v35.0</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    
    <link rel="stylesheet" href="style.css">
    
    <script type="module" src="https://unpkg.com/esp-web-tools@8.0.1/dist/web/install-button.js?module"></script>
</head>
<body>

<canvas id="bg-canvas"></canvas>
<canvas id="fg-canvas"></canvas>

<div class="center-ui" id="ui-wrapper">
    
    <div id="menu-box">
        <button id="start-btn" onclick="initiateFlash()">START INSTALLATION</button>
        
        <div class="sub-buttons">
            <a href="firmware/nitro_pro.zip" class="btn-secondary">📁 DOWNLOAD BIN FILES (ZIP)</a>
            
            <a href="https://silabs.com/developers/usb-to-uart-bridge-vcp-drivers" target="_blank" class="btn-secondary">📥 INSTALL USB DRIVERS</a>
        </div>
    </div>

    <div id="sparkler-stage">
        <div class="sparkler-unit">
            <div class="stick-assembly">
                <div class="iron-core">
                    <div class="burnt-residue" id="residue"></div>
                    
                    <div class="fuel-coating" id="fuel">
                        <div class="burning-point" id="igniter"></div>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="progress-container">
            <div class="percentage" id="pct">0%</div>
            <div class="status-msg">Firmware Uploading...</div>
        </div>
    </div>
</div>

<h1 id="success-text">SUCCESSFUL</h1>

<div id="wifi-container">
    </div>

<esp-web-install-button id="installer" manifest="./manifest.json">
    <button slot="activate" style="display:none">FLASH</button>
    <button slot="show-wifi" style="display:none">📶 CONNECT NITRO-WIFI</button>
</esp-web-install-button>

<script src="script.js"></script>

</body>
</html>
